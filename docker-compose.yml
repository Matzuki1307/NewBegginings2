# Entorno local completo: app + PostgreSQL.
# Uso: docker compose up --build  ->  http://localhost:3000
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: newbeginnings
      POSTGRES_PASSWORD: newbeginnings
      POSTGRES_DB: newbeginnings
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U newbeginnings -d newbeginnings"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    environment:
      DATABASE_URL: postgres://newbeginnings:newbeginnings@db:5432/newbeginnings
      SESSION_SECRET: secreto-solo-para-desarrollo
      # En local no hay HTTPS, así que la cookie de sesión no puede ser "secure"
      NODE_ENV: development
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
