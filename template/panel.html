<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi panel - New Beginnings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/JS/tailwind-config.js"></script>
    <script src="/assets/JS/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header id="app-header"></header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <h1 id="saludo" class="text-2xl font-bold text-gray-900">Hola</h1>
        <p id="subtitulo" class="text-gray-600 mt-1 mb-8">¿Qué quieres hacer hoy?</p>

        <div id="indicadores" class="hidden grid gap-4 grid-cols-2 lg:grid-cols-4 mb-8"></div>

        <div id="tarjetas" class="grid gap-4 sm:grid-cols-2 lg:grid-cols-3"></div>
    </main>

    <script>
        // Íconos (trazos de 24x24) para cada tarjeta
        const ICONOS = {
            crear_ticket: 'M12 4v16m8-8H4',
            mis_tickets: 'M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4',
            bandeja: 'M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2-2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4',
            beneficiarios: 'M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z',
            estadisticas: 'M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z',
            usuarios: 'M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z',
            roles: 'M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z'
        };

        document.addEventListener('DOMContentLoaded', async () => {
            const usuario = await App.iniciar();
            document.getElementById('saludo').textContent = `Hola, ${usuario.nombre}`;
            document.getElementById('subtitulo').textContent = `Ingresaste como ${usuario.rol}. ¿Qué quieres hacer hoy?`;

            // Indicadores según el rol (si fallan, el panel sigue funcionando)
            App.api('/api/panel/resumen').then(indicadores => {
                const zona = document.getElementById('indicadores');
                if (indicadores.length === 0) return;
                zona.innerHTML = indicadores.map(i => {
                    const contenido = `
                        <p class="text-sm text-gray-500">${App.escapar(i.nombre)}</p>
                        <p class="text-3xl font-bold tabular-nums mt-1 ${i.alerta ? 'text-amber-600' : 'text-gray-900'}">${i.valor.toLocaleString('es-CO')}</p>`;
                    return i.ruta
                        ? `<a href="${i.ruta}" class="bg-white rounded-lg shadow-sm p-5 hover:shadow-md transition">${contenido}</a>`
                        : `<div class="bg-white rounded-lg shadow-sm p-5">${contenido}</div>`;
                }).join('');
                zona.classList.remove('hidden');
            }).catch(() => {});

            const contenedor = document.getElementById('tarjetas');
            if (usuario.tarjetas.length === 0) {
                contenedor.innerHTML = `
                    <div class="sm:col-span-2 lg:col-span-3 bg-white rounded-lg border border-dashed border-gray-300 p-8 text-center text-gray-600">
                        Tu rol todavía no tiene secciones habilitadas. Contacta al administrador.
                    </div>`;
                return;
            }

            contenedor.innerHTML = usuario.tarjetas.map(t => `
                <a href="${t.ruta}" class="group bg-white rounded-lg shadow-sm border border-gray-100 p-6 hover:shadow-md hover:border-primary-light transition">
                    <div class="h-12 w-12 rounded-lg bg-blue-50 text-primary flex items-center justify-center mb-4 group-hover:bg-primary group-hover:text-white transition">
                        <svg class="h-6 w-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                            <path stroke-linecap="round" stroke-linejoin="round" d="${ICONOS[t.codigo] || ICONOS.mis_tickets}"/>
                        </svg>
                    </div>
                    <h2 class="text-lg font-semibold text-gray-900">${App.escapar(t.nombre)}</h2>
                    <p class="text-sm text-gray-600 mt-1">${App.escapar(t.descripcion)}</p>
                </a>`).join('');
        });
    </script>
</body>
</html>
