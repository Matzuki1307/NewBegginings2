<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Usuarios - New Beginnings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="/assets/JS/tailwind-config.js"></script>
    <script src="/assets/JS/app.js"></script>
</head>
<body class="bg-gray-50 min-h-screen">
    <header id="app-header"></header>

    <main class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex flex-wrap items-end justify-between gap-3 mb-6">
            <div>
                <h1 class="text-2xl font-bold text-gray-900">Usuarios</h1>
                <p class="text-gray-600 mt-1">Crea cuentas para funcionarios y administra las existentes.</p>
            </div>
            <button id="nuevo" class="bg-primary hover:bg-primary-dark text-white font-medium py-2 px-4 rounded-md">Nuevo usuario</button>
        </div>

        <div class="bg-white rounded-lg shadow-sm p-4 mb-6 grid gap-4 md:grid-cols-4 md:items-end">
            <div class="md:col-span-2">
                <label for="q" class="block text-sm font-medium text-gray-700 mb-1">Buscar</label>
                <input id="q" type="search" placeholder="Nombre o correo" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            <div>
                <label for="filtro-rol" class="block text-sm font-medium text-gray-700 mb-1">Rol</label>
                <select id="filtro-rol" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                    <option value="">Todos</option>
                </select>
            </div>
            <div>
                <label for="filtro-activo" class="block text-sm font-medium text-gray-700 mb-1">Estado</label>
                <select id="filtro-activo" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                    <option value="">Todos</option>
                    <option value="true">Activos</option>
                    <option value="false">Inactivos</option>
                </select>
            </div>
        </div>

        <p id="error" class="hidden mb-4 p-3 rounded-md bg-red-50 text-red-700 text-sm"></p>

        <div class="bg-white rounded-lg shadow-sm overflow-hidden">
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200 text-sm">
                    <thead class="bg-gray-50 text-left text-xs font-semibold text-gray-500 uppercase tracking-wide">
                        <tr>
                            <th class="px-4 py-3">Nombre</th>
                            <th class="px-4 py-3">Correo</th>
                            <th class="px-4 py-3">Teléfono</th>
                            <th class="px-4 py-3">Rol</th>
                            <th class="px-4 py-3">Estado</th>
                            <th class="px-4 py-3">Registro</th>
                            <th class="px-4 py-3 text-right">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla" class="divide-y divide-gray-100"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal crear/editar -->
    <div id="modal" class="hidden fixed inset-0 z-40 bg-black/40 flex items-center justify-center p-4">
        <form id="form-usuario" class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6 space-y-4 max-h-full overflow-y-auto" novalidate>
            <h2 id="modal-titulo" class="text-lg font-semibold text-gray-900">Nuevo usuario</h2>
            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label for="nombre" class="block text-sm font-medium text-gray-700 mb-1">Nombre *</label>
                    <input id="nombre" maxlength="100" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label for="apellido" class="block text-sm font-medium text-gray-700 mb-1">Apellido *</label>
                    <input id="apellido" maxlength="100" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
            </div>
            <div>
                <label for="email" class="block text-sm font-medium text-gray-700 mb-1">Correo electrónico *</label>
                <input id="email" type="email" maxlength="255" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
            </div>
            <div class="grid gap-4 sm:grid-cols-2">
                <div>
                    <label for="telefono" class="block text-sm font-medium text-gray-700 mb-1">Teléfono</label>
                    <input id="telefono" type="tel" maxlength="15" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                </div>
                <div>
                    <label for="rol" class="block text-sm font-medium text-gray-700 mb-1">Rol *</label>
                    <select id="rol" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary"></select>
                </div>
            </div>
            <div>
                <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña <span id="password-requerida">*</span></label>
                <input id="password" type="password" autocomplete="new-password" class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-primary">
                <p id="password-ayuda" class="text-xs text-gray-500 mt-1">Mínimo 8 caracteres, una letra mayúscula y un número.</p>
            </div>
            <p id="error-modal" class="hidden p-3 rounded-md bg-red-50 text-red-700 text-sm"></p>
            <div class="flex justify-end gap-3 pt-2">
                <button type="button" id="cancelar" class="border border-gray-300 text-gray-700 hover:bg-gray-100 py-2 px-4 rounded-md">Cancelar</button>
                <button class="bg-primary hover:bg-primary-dark text-white font-medium py-2 px-4 rounded-md">Guardar</button>
            </div>
        </form>
    </div>

    <script>
        let usuarios = [];
        let editando = null; // id del usuario en edición, o null si es nuevo

        // Relaciona las etiquetas de "faltantes" que devuelve la API con los campos
        const CAMPOS = { 'Nombre': 'nombre', 'Apellido': 'apellido', 'Correo electrónico': 'email', 'Rol': 'rol', 'Contraseña': 'password' };

        async function cargar() {
            const params = new URLSearchParams();
            const q = document.getElementById('q').value.trim();
            if (q) params.set('q', q);
            if (document.getElementById('filtro-rol').value) params.set('rolId', document.getElementById('filtro-rol').value);
            if (document.getElementById('filtro-activo').value) params.set('activo', document.getElementById('filtro-activo').value);

            try {
                usuarios = await App.api('/api/usuarios?' + params);
                App.error(document.getElementById('error'), '');
            } catch (error) {
                App.error(document.getElementById('error'), error.message);
                usuarios = [];
            }

            const tabla = document.getElementById('tabla');
            if (usuarios.length === 0) {
                tabla.innerHTML = '<tr><td colspan="7" class="px-4 py-8 text-center text-gray-500">No hay usuarios con estos filtros.</td></tr>';
                return;
            }
            tabla.innerHTML = usuarios.map(u => {
                const esYo = u.id === App.usuario.id;
                return `
                    <tr class="${u.activo ? '' : 'bg-gray-50 text-gray-500'}">
                        <td class="px-4 py-3 font-medium text-gray-900">${App.escapar(u.nombre + ' ' + u.apellido)}${esYo ? ' <span class="text-xs text-gray-500">(tú)</span>' : ''}</td>
                        <td class="px-4 py-3">${App.escapar(u.email)}</td>
                        <td class="px-4 py-3">${App.escapar(u.telefono || '-')}</td>
                        <td class="px-4 py-3">${App.escapar(u.rol)}</td>
                        <td class="px-4 py-3">${u.activo
                            ? '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-green-100 text-green-800">Activo</span>'
                            : '<span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-gray-200 text-gray-700">Inactivo</span>'}</td>
                        <td class="px-4 py-3 whitespace-nowrap">${App.fecha(u.fecha_registro)}</td>
                        <td class="px-4 py-3 text-right whitespace-nowrap space-x-3">
                            <button data-editar="${u.id}" class="text-primary hover:underline">Editar</button>
                            ${esYo ? '' : `<button data-activo="${u.id}" class="${u.activo ? 'text-red-600' : 'text-green-700'} hover:underline">${u.activo ? 'Desactivar' : 'Activar'}</button>`}
                        </td>
                    </tr>`;
            }).join('');
        }

        function abrirModal(usuario) {
            editando = usuario ? usuario.id : null;
            const form = document.getElementById('form-usuario');
            form.reset();
            form.querySelectorAll('input, select').forEach(el => el.classList.remove('border-red-500'));
            App.error(document.getElementById('error-modal'), '');
            document.getElementById('modal-titulo').textContent = usuario ? 'Editar usuario' : 'Nuevo usuario';
            document.getElementById('password-requerida').classList.toggle('hidden', Boolean(usuario));
            document.getElementById('password-ayuda').textContent = usuario
                ? 'Déjala vacía para no cambiarla. Mínimo 8 caracteres, una mayúscula y un número.'
                : 'Mínimo 8 caracteres, una letra mayúscula y un número.';
            if (usuario) {
                for (const campo of ['nombre', 'apellido', 'email', 'telefono']) document.getElementById(campo).value = usuario[campo] || '';
                document.getElementById('rol').value = usuario.rol_id;
            }
            // No se puede cambiar el propio rol
            document.getElementById('rol').disabled = Boolean(usuario) && usuario.id === App.usuario.id;
            document.getElementById('modal').classList.remove('hidden');
            document.getElementById('nombre').focus();
        }

        function cerrarModal() {
            document.getElementById('modal').classList.add('hidden');
        }

        async function guardar(e) {
            e.preventDefault();
            const form = e.target;
            form.querySelectorAll('input, select').forEach(el => el.classList.remove('border-red-500'));
            const datos = {
                nombre: document.getElementById('nombre').value,
                apellido: document.getElementById('apellido').value,
                email: document.getElementById('email').value,
                telefono: document.getElementById('telefono').value,
                rolId: document.getElementById('rol').value,
                password: document.getElementById('password').value
            };
            try {
                const respuesta = editando
                    ? await App.api(`/api/usuarios/${editando}`, { method: 'PUT', body: datos })
                    : await App.api('/api/usuarios', { method: 'POST', body: datos });
                cerrarModal();
                App.aviso(respuesta.mensaje);
                cargar();
            } catch (error) {
                App.error(document.getElementById('error-modal'), error.message);
                // Resalta los campos que faltan
                (error.datos?.faltantes || []).forEach(etiqueta => {
                    const id = CAMPOS[etiqueta];
                    if (id) document.getElementById(id).classList.add('border-red-500');
                });
            }
        }

        document.addEventListener('DOMContentLoaded', async () => {
            await App.iniciar();

            const roles = await App.api('/api/roles');
            const opciones = roles.map(r => `<option value="${r.id}">${App.escapar(r.nombre)}</option>`).join('');
            document.getElementById('rol').innerHTML = '<option value="">Selecciona un rol</option>' + opciones;
            document.getElementById('filtro-rol').innerHTML += opciones;

            let espera;
            document.getElementById('q').addEventListener('input', () => { clearTimeout(espera); espera = setTimeout(cargar, 300); });
            document.getElementById('filtro-rol').addEventListener('change', cargar);
            document.getElementById('filtro-activo').addEventListener('change', cargar);
            document.getElementById('nuevo').addEventListener('click', () => abrirModal(null));
            document.getElementById('cancelar').addEventListener('click', cerrarModal);
            document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') cerrarModal(); });
            document.addEventListener('keydown', e => { if (e.key === 'Escape') cerrarModal(); });
            document.getElementById('form-usuario').addEventListener('submit', guardar);

            document.getElementById('tabla').addEventListener('click', async e => {
                const editar = e.target.closest('[data-editar]');
                const activo = e.target.closest('[data-activo]');
                if (editar) {
                    abrirModal(usuarios.find(u => u.id === Number(editar.dataset.editar)));
                } else if (activo) {
                    const usuario = usuarios.find(u => u.id === Number(activo.dataset.activo));
                    try {
                        const respuesta = await App.api(`/api/usuarios/${usuario.id}/activo`, {
                            method: 'PATCH', body: { activo: !usuario.activo } });
                        App.aviso(respuesta.mensaje);
                        cargar();
                    } catch (error) {
                        App.aviso(error.message, 'error');
                    }
                }
            });

            cargar();
        });
    </script>
</body>
</html>
